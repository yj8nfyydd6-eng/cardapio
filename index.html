<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cardapio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4ee;--card:#fff;--ink:#1b2a22;--mute:#5f6d65;--line:#dde2d8;--brand:#1f6f54;--on-brand:#fff;--hi:#f0b429;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141b17;--card:#1d2722;--ink:#eef2ec;--mute:#9fb0a5;--line:#2c3a33;--brand:#4cc29a;--on-brand:#0c1a13}}
:root[data-theme="dark"]{--bg:#141b17;--card:#1d2722;--ink:#eef2ec;--mute:#9fb0a5;--line:#2c3a33;--brand:#4cc29a;--on-brand:#0c1a13}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif;padding-bottom:110px}
h1,h2{font-family:"Bricolage Grotesque",-apple-system,system-ui,sans-serif;margin:0}
header{padding:28px 20px 12px}
h1{font-size:2.4rem;font-weight:800;letter-spacing:-.02em}
header p{margin:4px 0 0;color:var(--mute)}
nav{display:flex;gap:8px;overflow-x:auto;padding:10px 20px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 16px;border-radius:99px;font:inherit;font-weight:600}
nav button.on{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
main{padding:0 20px;max-width:640px;margin:0 auto}
h2{font-size:1.4rem;margin:22px 0 10px}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.info{flex:1;min-width:0}
.info b{display:block}
.info small{color:var(--mute)}
.price{font-weight:700;margin-top:4px}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:36px;height:36px;border-radius:50%;border:1px solid var(--brand);background:transparent;color:var(--brand);font-size:1.3rem;line-height:1}
.qty button.add{background:var(--brand);color:var(--on-brand)}
.qty span{min-width:18px;text-align:center;font-weight:700}
#bar{position:fixed;left:0;right:0;bottom:0;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
#send{width:100%;max-width:640px;display:block;margin:0 auto;border:0;border-radius:14px;padding:15px;background:var(--brand);color:var(--on-brand);font:inherit;font-weight:700;font-size:1.05rem}
#send:disabled{opacity:.45}
</style>
</head>
<body>
<header>
  <h1 id="nome"></h1>
  <p>Toque em + para montar seu pedido.</p>
</header>
<nav id="abas"></nav>
<main id="lista"></main>
<div id="bar"><button id="send" disabled>Seu pedido está vazio</button></div>

<script>
// ===== 1) EDITE AQUI: seus dados =====
const NOME = "Lanchonete do Zé";
const WHATSAPP = "5511999999999"; // país + DDD + número, só dígitos

const CARDAPIO = [
  { categoria: "Lanches", itens: [
    { nome: "X-Burger", desc: "Pão, hambúrguer, queijo e salada", preco: 18.00 },
    { nome: "X-Bacon", desc: "Hambúrguer, queijo e bacon crocante", preco: 22.00 },
    { nome: "Misto quente", desc: "Presunto e queijo na chapa", preco: 9.50 }
  ]},
  { categoria: "Bebidas", itens: [
    { nome: "Refrigerante lata", desc: "350 ml", preco: 6.00 },
    { nome: "Suco natural", desc: "Laranja ou limão, 400 ml", preco: 8.00 }
  ]},
  { categoria: "Sobremesas", itens: [
    { nome: "Pudim", desc: "Fatia individual", preco: 7.00 },
    { nome: "Brigadeiro", desc: "Unidade", preco: 3.00 }
  ]}
];

// ===== 2) Lógica do app =====
const brl = n => n.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const pedido = {}; // "nome" -> quantidade
const precos = {};

document.getElementById("nome").textContent = NOME;
document.title = NOME;

const lista = document.getElementById("lista");
const abas = document.getElementById("abas");

CARDAPIO.forEach((cat, i) => {
  const sec = document.createElement("section");
  sec.id = "cat" + i;
  sec.innerHTML = "<h2>" + cat.categoria + "</h2>";
  cat.itens.forEach(it => {
    precos[it.nome] = it.preco;
    const el = document.createElement("div");
    el.className = "item";
    el.innerHTML =
      '<div class="info"><b>' + it.nome + '</b><small>' + it.desc + '</small><div class="price">' + brl(it.preco) + '</div></div>' +
      '<div class="qty"><button class="menos" aria-label="Remover" hidden>−</button><span hidden>0</span><button class="add mais" aria-label="Adicionar">+</button></div>';
    const menos = el.querySelector(".menos"), mais = el.querySelector(".mais"), num = el.querySelector("span");
    const mudar = d => {
      pedido[it.nome] = Math.max(0, (pedido[it.nome] || 0) + d);
      const q = pedido[it.nome];
      num.textContent = q;
      menos.hidden = num.hidden = q === 0;
      atualizar();
    };
    menos.onclick = () => mudar(-1);
    mais.onclick = () => mudar(1);
    sec.appendChild(el);
  });
  lista.appendChild(sec);

  const b = document.createElement("button");
  b.textContent = cat.categoria;
  b.onclick = () => document.getElementById("cat" + i).scrollIntoView({ behavior: "smooth" });
  abas.appendChild(b);
});
abas.firstChild.classList.add("on");

const send = document.getElementById("send");
function atualizar() {
  const nomes = Object.keys(pedido).filter(n => pedido[n] > 0);
  const total = nomes.reduce((s, n) => s + pedido[n] * precos[n], 0);
  const qtd = nomes.reduce((s, n) => s + pedido[n], 0);
  send.disabled = qtd === 0;
  send.textContent = qtd === 0 ? "Seu pedido está vazio" : "Enviar pedido (" + qtd + ") · " + brl(total);
}

send.onclick = () => {
  const nomes = Object.keys(pedido).filter(n => pedido[n] > 0);
  const total = nomes.reduce((s, n) => s + pedido[n] * precos[n], 0);
  const linhas = nomes.map(n => pedido[n] + "x " + n + " - " + brl(pedido[n] * precos[n]));
  const msg = "Olá! Quero fazer um pedido:\n\n" + linhas.join("\n") + "\n\nTotal: " + brl(total);
  window.location.href = "https://wa.me/" + WHATSAPP + "?text=" + encodeURIComponent(msg);
};
</script>
</body>
</html>
